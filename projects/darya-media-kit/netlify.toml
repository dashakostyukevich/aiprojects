# The site is plain HTML/CSS/JS with no build step, so the repo root is the
# publish directory and Netlify serves it as-is.
[build]
  publish = "."
  command = ""

# Force .html on directory requests so /index.html links resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"