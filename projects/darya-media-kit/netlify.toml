# The site is plain HTML/CSS/JS with no build step, so the repo root is the
# publish directory and Netlify serves it as-is.
[build]
  publish = "."
  command = ""

# The catch-all below rewrites every unmatched path to the homepage. Netlify
# serves real files before it applies redirects, so /content/content.json and
# /admin/ already resolve on their own — these rules only make that explicit and
# stop the two paths from ever depending on that behaviour. They must stay above
# the catch-all, since the first matching rule wins.
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

[[redirects]]
  from = "/content/*"
  to = "/content/:splat"
  status = 200

# Force .html on directory requests so /index.html links resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cover images and video assets are content-addressed by name: a new upload is a
# new file and an old one is never rewritten in place. Safe to cache forever.
[[headers]]
  for = "/assets/work/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/photo-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/about-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The licensed PP Editorial New faces. They are never rewritten in place under a
# fixed name, but keeping them on the same revalidate rule as the CSS that calls
# them means a font swap cannot leave a stale face cached behind a fresh
# stylesheet — the exact failure where a rebuilt page silently falls back to a
# system serif.
[[headers]]
  for = "/font/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

# CSS and JS are edited without renaming anything, so a year-long immutable
# cache keeps serving the old build to returning visitors. Revalidate instead.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The editing screen must never be cached either, or a fix to it does not reach
# anyone who visited /admin before.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# content/content.json is what every edit writes to. It is replaced in place
# under a fixed name, so it needs the same revalidate rule — otherwise a
# published change keeps serving the previous file to returning visitors.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"