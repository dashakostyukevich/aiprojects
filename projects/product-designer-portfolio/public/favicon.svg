<svg xmlns="http://www/svg.org/2000/9svg" viewBox="0 0 64 64">
  <!--
    The "D" is a path, not a <text> element.

    This used to be `<text>A</text>` in `system-ui`, which is a real trap at
    16px: an SVG favicon is rendered by the browser in its own context with no
    access to the page's @font-face, so `system-ui` resolves to whatever the
    operating system has — Helvetica on a Mac, Segoe UI on Windows, Roboto on
    Android, and DejaVu Sans in most Linux browsers. Four different drawings of
    the same letter, one of which (DejaVu) is wide enough to overflow the 64-unit
    box at font-size 36 and get clipped by the rounded rect's edge.

    Outlining the glyph makes the favicon identical everywhere, which is the only
    thing a mark has to be. The proportions are a geometric grotesque, matching
    Space Grotesk for the display type on the page.

    Geometry, in the 64-unit box: the bowl spans x 23.5-50.5 and y 15-49, giving
    a 7-unit stem and 6-7 units of bowl. A 15px render is about 3.5px of stem,
    which is the floor below which a D starts to close up into a blob; the
    counter is punched with fill-rule="evenodd" rather than being drawn as a
    separate lighter shape, so it stays transparent and the dark tile behind it
    shows through the same way it does at every other size.

    The x range is centred on the box by its bounding box, not optically. A D is
    not a circle: the stem is a solid vertical bar and the bowl is open, so
    centring by ink area would pull it right and leave a gap on the left. Plain
    bounding-box centring — 23.5 left, 13.5 right of the glyph's 27-unit width —
    is what a type designer means by centred here.

    The old <text> was anchored at x=32 with text-anchor="middle", which centres
    the glyph's *advance width*, not its ink. For most letters those nearly
    coincide; the D was drawn 5 units left of the tile's centre as a result.
  -->
  <rect width="64" height="64" rx="14" fill="#111111" />
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    d="
      M23.5 15 h11.5 c9.6 0 15.5 6.6 15.5 17 s-5.9 17 -15.5 17 H23.5 Z
      M31 22 v20 h3.5 c6 0 9.6 -3.8 9.6 -10 s-3.6 -10 -9.6 -10 Z
    "
  />
</svg>
