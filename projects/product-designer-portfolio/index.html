<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk for headings and display type, Geist for body and UI.
         Both are variable fonts, so the weights below cover the whole range the
         site uses (400-700) in a single file each. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Geist:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Portfolio of Alex Morgan, a product designer working on calm, useful interfaces for complex products."
    />
    <meta property="og:title" content="Alex Morgan — Product Designer" />
    <meta
      property="og:description"
      content="I design calm, useful interfaces for complex products."
    />
    <meta property="og:type" content="website" />
    <title>Alex Morgan — Product Designer</title>
  </head>
  <body>
    <noscript>
      <!-- Entrance animations are JS-driven, so without JS everything must be
           visible from the start. Mirrors the reduced-motion rule. -->
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }

        /* SplitReveal words start hidden and are revealed by JS. Without JS
           they would stay invisible, so force them visible. */
        .split-word {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
