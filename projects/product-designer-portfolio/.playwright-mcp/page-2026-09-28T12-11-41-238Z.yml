                - generic [ref=f91e74]: how the solution works
              - listitem [ref=f91e75]:
                - generic [ref=f91e77]: where it can be used
              - listitem [ref=f91e78]:
                - generic [ref=f91e80]: what makes the system different
            - paragraph [ref=f91e81]: At the same time, the brand needed to feel technical, reliable, and modern rather than like a traditional defense-industry website.
            - paragraph [ref=f91e82]: Because the project is under NDA, this case study focuses only on the publicly available product and the design work I can share.
