                  - generic [ref=f91e93]: The site’s narrative structure — from what it is to how to learn more
            - paragraph [ref=f91e94]: "I approached the website as a storytelling experience rather than simply a collection of product pages. The information was structured around a simple progression:"
            - paragraph [ref=f91e95]: What is it? → How does it work? → What makes it different? → Where can it be used? → How can I learn more?
            - paragraph [ref=f91e96]: This allowed visitors to gradually understand the technology without being overwhelmed by technical information.
