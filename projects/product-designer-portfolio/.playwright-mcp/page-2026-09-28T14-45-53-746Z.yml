      - paragraph [ref=f159e143]: Three ways I usually get pulled into a product. Most engagements combine them — the split depends on how much of the problem is still undefined when we start.
      - generic [ref=f159e144]:
        - generic [ref=f159e145]:
          - generic [ref=f159e146]: "01"
          - generic [ref=f159e147]:
            - heading "Product Design" [level=3] [ref=f159e148]
            - paragraph [ref=f159e149]: I design digital products from early concepts to polished, developer-ready interfaces. I work on user flows, information architecture, interaction design, responsive UI, prototyping, and design systems, with a focus on making complex products simple and intuitive.
        - generic [ref=f159e150]:
          - generic [ref=f159e151]: "02"
          - generic [ref=f159e152]:
            - heading "Webflow Development" [level=3] [ref=f159e153]
            - paragraph [ref=f159e154]: I turn Figma designs into responsive, production-ready websites in Webflow. I build scalable components, CMS-powered pages, interactions, and animations while keeping the design accurate, accessible, and easy to maintain.
        - generic [ref=f159e155]:
          - generic [ref=f159e156]: "03"
          - generic [ref=f159e157]:
            - heading "UX & Design Systems" [level=3] [ref=f159e158]
            - paragraph [ref=f159e159]: I improve existing digital products by identifying usability issues, simplifying user flows, and creating consistent UI systems. From UX audits and iterative improvements to components, variants, and UI guidelines, I help products become clearer, more scalable, and easier to use.
