              - listitem [ref=f146e74]:
                - generic [ref=f146e76]: what makes the system different
            - paragraph [ref=f146e77]: At the same time, the brand needed to feel technical, reliable, and modern rather than like a traditional defense-industry website.
            - paragraph [ref=f146e78]: Because the project is under NDA, this case study focuses only on the publicly available product and the design work I can share.
        - generic [ref=f146e80]:
