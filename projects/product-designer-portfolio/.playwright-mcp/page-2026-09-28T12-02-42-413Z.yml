      - generic [ref=f67e34]:
        - generic [ref=f67e35]:
          - generic [ref=f67e36]:
            - paragraph [ref=f67e37]: Managing money becomes complicated when it is spread across multiple accounts, banks, currencies, and sources of income. Groshi was designed to bring everything into one place and help people understand, plan, and control their finances with more confidence.
            - paragraph [ref=f67e38]: I joined the product while it was already in development. My challenge was not simply to design new screens, but to bring structure to an evolving product, improve existing experiences, and introduce new functionality without making the experience more complicated.
          - paragraph [ref=f67e39]: "Structure before scale: researched, tested, and implemented"
