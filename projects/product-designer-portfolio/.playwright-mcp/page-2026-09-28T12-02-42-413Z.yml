                      - generic [ref=f67e282]: Image needed
                      - generic [ref=f67e283]: The opening onboarding form — who the user is and what they are looking for
                - paragraph [ref=f67e284]: At the beginning, we introduced a short form to understand who the user was and what they were looking for. This gave the product an opportunity to make onboarding more relevant to the user’s needs instead of presenting everyone with the same generic introduction.
            - generic [ref=f67e285]:
              - heading "02 Guide users through setup" [level=3] [ref=f67e286]:
                - generic [ref=f67e287]: "02"
                - generic [ref=f67e288]: Guide users through setup
              - generic [ref=f67e289]:
                - figure [ref=f67e290]:
                  - figure "Image needed The step-by-step account setup flow" [ref=f67e291]:
                    - generic [ref=f67e293]:
                      - generic [ref=f67e294]: Image needed
                      - generic [ref=f67e295]: The step-by-step account setup flow
                - paragraph [ref=f67e296]: I created a step-by-step account setup flow that broke the process into manageable stages. Rather than asking users to understand the whole product immediately, onboarding gradually introduced the information needed to get started.
                - paragraph [ref=f67e297]: The result was a more guided entry into a product that could otherwise feel complex from the first interaction.
