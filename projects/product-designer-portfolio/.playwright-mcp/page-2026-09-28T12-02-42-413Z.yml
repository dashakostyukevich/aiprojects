      - generic [ref=f67e57]:
        - generic [ref=f67e59]:
          - heading "The challenge" [level=2] [ref=f67e60]
          - generic [ref=f67e62]:
            - paragraph [ref=f67e63]: Personal finances are becoming increasingly fragmented. People may have several bank accounts, credit cards, savings accounts, different currencies, and multiple sources of income. When all of this information lives in different places, it becomes difficult to understand the bigger picture.
            - paragraph [ref=f67e64]: "The research behind Groshi highlighted several recurring needs:"
            - list [ref=f67e65]:
              - listitem [ref=f67e66]:
                - generic [ref=f67e68]: seeing a complete financial picture
              - listitem [ref=f67e69]:
                - generic [ref=f67e71]: understanding where money is going
              - listitem [ref=f67e72]:
                - generic [ref=f67e74]: managing budgets and financial goals
              - listitem [ref=f67e75]:
                - generic [ref=f67e77]: reducing the amount of manual tracking
              - listitem [ref=f67e78]:
                - generic [ref=f67e80]: working with multiple accounts and currencies
              - listitem [ref=f67e81]:
                - generic [ref=f67e83]: feeling confident that financial information is organized and understandable
            - paragraph [ref=f67e84]: The product needed to make this complexity feel manageable rather than overwhelming.
        - generic [ref=f67e86]:
          - heading "I joined an existing product — but there was no architecture" [level=2] [ref=f67e87]
          - generic [ref=f67e89]:
            - paragraph [ref=f67e90]: When I joined Groshi, the product already had screens and design decisions, but it did not yet have a clear information architecture. This quickly became a problem.
            - paragraph [ref=f67e91]: With multiple accounts, transactions, categories, reports, budgets, and other features, designing screens individually made it difficult to create coherent user flows. Before expanding the product, I needed to understand how all these pieces fit together.
            - paragraph [ref=f67e92]: So I created the product architecture and used it as a foundation for subsequent UX decisions. The goal was to establish a structure that could scale as new features were introduced, while keeping the relationship between accounts, transactions, categories, analytics, and budgets clear.
        - generic [ref=f67e94]:
          - 'heading "Research: understanding what users actually struggle with" [level=2] [ref=f67e95]'
          - generic [ref=f67e97]:
            - paragraph [ref=f67e98]: Rather than relying only on assumptions about personal finance, I collected qualitative feedback from discussions and reviews of finance products. I organized the feedback by feature and sentiment to identify recurring patterns and areas where users were experiencing friction.
            - paragraph [ref=f67e99]: "Several themes emerged:"
            - generic [ref=f67e100]:
              - heading "01 The need for a complete picture" [level=3] [ref=f67e101]:
                - generic [ref=f67e102]: "01"
                - generic [ref=f67e103]: The need for a complete picture
              - paragraph [ref=f67e105]: Users wanted to understand their overall financial situation rather than look at isolated transactions or accounts.
            - generic [ref=f67e106]:
              - heading "02 Too much information can become overwhelming" [level=3] [ref=f67e107]:
                - generic [ref=f67e108]: "02"
                - generic [ref=f67e109]: Too much information can become overwhelming
              - paragraph [ref=f67e111]: Financial products often contain a lot of data. Simply adding more information does not necessarily make the experience more useful.
            - generic [ref=f67e112]:
              - heading "03 Budgeting is valuable, but needs to feel approachable" [level=3] [ref=f67e113]:
                - generic [ref=f67e114]: "03"
                - generic [ref=f67e115]: Budgeting is valuable, but needs to feel approachable
              - paragraph [ref=f67e117]: Budgeting can help users plan their finances, but the experience needs to make the first step obvious.
            - generic [ref=f67e118]:
              - heading "04 Onboarding matters" [level=3] [ref=f67e119]:
                - generic [ref=f67e120]: "04"
                - generic [ref=f67e121]: Onboarding matters
              - paragraph [ref=f67e123]: A complex financial product needs to explain itself. Users need guidance to understand what they can do and why the product is useful.
            - generic [ref=f67e124]:
              - heading "05 Flexibility and consistency matter" [level=3] [ref=f67e125]:
                - generic [ref=f67e126]: "05"
                - generic [ref=f67e127]: Flexibility and consistency matter
              - paragraph [ref=f67e129]: With multiple accounts and currencies, users need flexibility without having to learn different rules in different parts of the product.
            - paragraph [ref=f67e130]: These insights became the foundation for the product goals I proposed to the client.
        - generic [ref=f67e132]:
          - heading "From research to product goals" [level=2] [ref=f67e133]
          - generic [ref=f67e135]:
            - paragraph [ref=f67e136]: "Based on the research and the original product brief, I defined three core goals:"
            - list [ref=f67e137]:
              - listitem [ref=f67e138]:
                - generic [ref=f67e140]: Create a sense of control — help users understand what is happening with their money.
              - listitem [ref=f67e141]:
                - generic [ref=f67e143]: Reduce financial stress — make complex financial information easier to understand and manage.
              - listitem [ref=f67e144]:
                - generic [ref=f67e146]: Help users work toward financial goals — turn financial data into something users can act on through budgeting and planning.
            - paragraph [ref=f67e147]: These goals helped shift the design process from simply improving individual screens to thinking about the experience as a connected financial management system.
        - generic [ref=f67e149]:
          - heading "Competitive research" [level=2] [ref=f67e150]
          - generic [ref=f67e152]:
            - paragraph [ref=f67e153]: I looked at both direct finance products and products with useful patterns that could inform the experience.
            - table [ref=f67e155]:
              - rowgroup [ref=f67e156]:
                - row [ref=f67e157]:
                  - columnheader "Product" [ref=f67e158]
                  - columnheader "What I looked at" [ref=f67e159]
              - rowgroup [ref=f67e160]:
                - row [ref=f67e161]:
                  - rowheader "Revolut" [ref=f67e162]
                  - cell "UI quality and account organization" [ref=f67e163]
                - row [ref=f67e164]:
                  - rowheader "Monarch Money" [ref=f67e165]
                  - cell "Similar feature set and user flows" [ref=f67e166]
                - row [ref=f67e167]:
                  - rowheader "YNAB" [ref=f67e168]
                  - cell "Budgeting experience" [ref=f67e169]
                - row [ref=f67e170]:
                  - rowheader "HomeMoney" [ref=f67e171]
                  - cell "Managing multiple user accounts" [ref=f67e172]
                - row [ref=f67e173]:
                  - rowheader "Notion / Mint" [ref=f67e174]
                  - cell "Broader patterns and indirect inspiration" [ref=f67e175]
            - paragraph [ref=f67e176]: The goal was not to copy existing solutions. I used competitors to understand how established products solve similar problems, identify familiar interaction patterns, and find opportunities to make the Groshi experience clearer.
        - generic [ref=f67e178]:
          - heading "Designing a scalable financial structure" [level=2] [ref=f67e179]
          - generic [ref=f67e181]:
            - figure [ref=f67e182]:
              - figure "Image needed Groshi information architecture — accounts, transactions, categories, analytics, budgets" [ref=f67e183]:
                - generic [ref=f67e185]:
                  - generic [ref=f67e186]: Image needed
                  - generic [ref=f67e187]: Groshi information architecture — accounts, transactions, categories, analytics, budgets
            - paragraph [ref=f67e188]: "The architecture became the foundation for the rest of the product. I organized the experience around the major objects users need to manage:"
            - paragraph [ref=f67e189]: Accounts → Transactions → Categories → Analytics → Budgets
            - paragraph [ref=f67e190]: "This made it possible to think about features as parts of one system rather than independent screens. It was particularly important because Groshi supports multiple accounts and currencies: a decision made in one part of the product could affect reports, transactions, categories, and budgets elsewhere."
        - generic [ref=f67e192]:
          - heading "Making financial data easier to understand" [level=2] [ref=f67e193]
          - generic [ref=f67e195]:
            - figure [ref=f67e196]:
              - figure "Image needed Redesigned financial chart — selecting a month reveals the exact figures" [ref=f67e197]:
                - generic [ref=f67e199]:
                  - generic [ref=f67e200]: Image needed
                  - generic [ref=f67e201]: Redesigned financial chart — selecting a month reveals the exact figures
            - paragraph [ref=f67e202]: One of the existing experiences I redesigned was the financial chart. The original chart communicated information primarily through visual elements — columns and a line — but users had limited contextual information when looking at a particular month.
            - paragraph [ref=f67e203]: I redesigned the interaction so that selecting a month also revealed the relevant figures. Instead of asking users to estimate values from the visualization, the interaction provided the exact numbers alongside the visual trend.
            - paragraph [ref=f67e204]: "The principle: visual overview → contextual detail."
            - paragraph [ref=f67e205]: The chart could communicate the overall trend while still allowing users to investigate a specific point when they needed more precise information. I also refined the visual hierarchy and interaction patterns to make the analytics experience more consistent with the rest of the product.
        - generic [ref=f67e207]:
          - heading "Building a category system that could scale" [level=2] [ref=f67e208]
          - generic [ref=f67e210]:
            - figure [ref=f67e211]:
              - figure "Image needed Category management — creating, editing, and nesting categories" [ref=f67e212]:
                - generic [ref=f67e214]:
                  - generic [ref=f67e215]: Image needed
                  - generic [ref=f67e216]: Category management — creating, editing, and nesting categories
            - paragraph [ref=f67e217]: "Categories initially looked like a relatively simple feature. But once I considered the product as a whole, the challenge became much bigger. Groshi needed categories to work consistently across:"
            - list [ref=f67e218]:
              - listitem [ref=f67e219]:
                - generic [ref=f67e221]: multiple accounts
              - listitem [ref=f67e222]:
                - generic [ref=f67e224]: transactions
              - listitem [ref=f67e225]:
                - generic [ref=f67e227]: reports
              - listitem [ref=f67e228]:
                - generic [ref=f67e230]: budgets
              - listitem [ref=f67e231]:
                - generic [ref=f67e233]: multiple currencies
            - paragraph [ref=f67e234]: The main UX challenge was hierarchy and nesting. If categories are structured differently depending on where the user encounters them, the product quickly becomes difficult to understand.
            - paragraph [ref=f67e235]: I therefore designed a more complete category management experience, including creating, editing, and organizing categories while maintaining consistency throughout the product.
            - paragraph [ref=f67e236]: A feature should not only work on its own. It needs to work as part of the entire product system.
        - generic [ref=f67e238]:
          - heading "Designing budgeting from scratch" [level=2] [ref=f67e239]
          - generic [ref=f67e241]:
            - figure [ref=f67e242]:
              - figure "Image needed Budget creation flow — prototyping in Figma and Lovable" [ref=f67e243]:
                - generic [ref=f67e245]:
                  - generic [ref=f67e246]: Image needed
                  - generic [ref=f67e247]: Budget creation flow — prototyping in Figma and Lovable
            - paragraph [ref=f67e248]: Budgeting was a completely new part of the product. Because Groshi was still developing its MVP, we had to balance research insights with business priorities and move quickly.
            - paragraph [ref=f67e249]: Rather than trying to build an advanced budgeting system immediately, we focused on creating a basic experience that could validate the core concept. I explored the flows using Figma and Lovable, which allowed us to prototype and iterate quickly before moving toward implementation.
            - paragraph [ref=f67e250]: The core flow allowed users to create budgets for their income and expenses.
        - generic [ref=f67e252]:
          - heading "Testing the budgeting experience" [level=2] [ref=f67e253]
          - generic [ref=f67e255]:
            - figure [ref=f67e256]:
              - figure "Image needed The first screen of the budgeting flow that two of three users found confusing" [ref=f67e257]:
                - generic [ref=f67e259]:
                  - generic [ref=f67e260]: Image needed
                  - generic [ref=f67e261]: The first screen of the budgeting flow that two of three users found confusing
            - paragraph [ref=f67e262]: "Before finalizing the flow, I tested it with 3 users. The task was simple:"
            - paragraph [ref=f67e263]: Create a budget category for expenses and income from the first screen.
            - paragraph [ref=f67e264]: All three users successfully completed the task. However, the test revealed an important usability issue — 2 out of 3 users were confused by the first screen.
            - paragraph [ref=f67e265]: They were not immediately sure what they were supposed to do or where they should go next. It took them some time to understand the entry point into the budgeting flow.
            - paragraph [ref=f67e266]: This was valuable because the test showed that task completion alone was not enough. The flow technically worked, but the starting point was not immediately discoverable. That finding informed the way I thought about entry points and guidance in the broader product experience.
        - generic [ref=f67e268]:
          - heading "Rebuilding onboarding from scratch" [level=2] [ref=f67e269]
          - generic [ref=f67e271]:
            - paragraph [ref=f67e272]: Onboarding was another area where the product needed more structure. Instead of simply introducing users to the interface, I designed the onboarding experience from the ground up. The new experience had two important parts.
            - generic [ref=f67e273]:
              - heading "01 Understand the user" [level=3] [ref=f67e274]:
