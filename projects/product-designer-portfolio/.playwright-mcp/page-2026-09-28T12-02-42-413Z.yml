        - generic [ref=f67e388]:
          - heading "What I learned" [level=2] [ref=f67e389]
          - generic [ref=f67e391]:
            - paragraph [ref=f67e392]: Joining a product in the middle of development taught me that Product Design is not always about starting with a blank canvas. Sometimes the challenge is understanding what already exists, identifying what is missing, and making new decisions fit into an evolving system.
            - paragraph [ref=f67e393]: The biggest lesson from Groshi was the importance of structure before scale. Without a clear architecture, adding more features only makes a product harder to navigate. Establishing the underlying structure first made it easier to design new experiences while keeping the product coherent.
            - paragraph [ref=f67e394]: I also learned to treat usability testing as a way to discover unexpected problems, not simply to confirm that a design works. In the budgeting test, every participant completed the task — but two still struggled with the first step. That distinction helped me look beyond successful task completion and pay more attention to discoverability and confidence.
            - paragraph [ref=f67e395]: If I were continuing the project, I would involve stakeholders earlier in defining the overall product structure, and map the complete user journey before expanding individual feature areas.
            - paragraph [ref=f67e396]: For me, Groshi became less about designing a finance dashboard and more about learning how to bring structure, clarity, and consistency to a complex product as it grows.
        - figure "What I learned" [ref=f67e397]:
          - blockquote [ref=f67e398]: The biggest lesson from Groshi was the importance of structure before scale. Without a clear architecture, adding more features only makes a product harder to navigate.
