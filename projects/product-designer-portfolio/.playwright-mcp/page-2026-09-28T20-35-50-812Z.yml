            - heading "Product Design" [level=3] [ref=f129e121]
            - paragraph [ref=f129e122]: I design digital products from early concepts to polished, developer-ready interfaces. I work on user flows, information architecture, interaction design, responsive UI, prototyping, and design systems, with a focus on making complex products simple and intuitive.
        - generic [ref=f129e123]:
          - generic [ref=f129e124]: "02"
