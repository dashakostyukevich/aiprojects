            - heading "Webflow Development" [level=3] [ref=f129e126]
            - paragraph [ref=f129e127]: I turn Figma designs into responsive, production-ready websites in Webflow. I build scalable components, CMS-powered pages, interactions, and animations while keeping the design accurate, accessible, and easy to maintain.
        - generic [ref=f129e128]:
          - generic [ref=f129e129]: "03"
          - generic [ref=f129e130]:
            - heading "UX & Design Systems" [level=3] [ref=f129e131]
            - paragraph [ref=f129e132]: I improve existing digital products by identifying usability issues, simplifying user flows, and creating consistent UI systems. From UX audits and iterative improvements to components, variants, and UI guidelines, I help products become clearer, more scalable, and easier to use.
