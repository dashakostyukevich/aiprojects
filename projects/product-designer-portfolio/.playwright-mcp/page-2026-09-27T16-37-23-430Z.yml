          - generic [ref=f38e21]: "2025"
        - paragraph [ref=f38e22]: "Redesigned the reporting experience for a data platform: faster filters, clearer empty states, and a chart builder non-analysts could use."
        - list [ref=f38e23]:
          - listitem [ref=f38e24]: Product design
          - listitem [ref=f38e25]: Design system
