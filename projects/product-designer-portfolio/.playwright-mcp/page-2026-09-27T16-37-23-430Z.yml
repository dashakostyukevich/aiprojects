        - generic [ref=f38e53]:
          - heading "01The problem" [level=2] [ref=f38e54]:
            - generic [ref=f38e55]: "01"
            - text: The problem
          - generic [ref=f38e56]:
            - paragraph [ref=f38e57]: Support tickets told the story better than the roadmap did. People were opening the product, staring at an empty dashboard, and leaving. In session tests, six of eight participants could not produce their first chart without help.
            - paragraph [ref=f38e58]: The existing filter panel exposed all 40 filter types at once. The chart builder assumed you already knew which aggregation you wanted. And the empty state said “No data,” which was technically true and completely useless.
        - generic [ref=f38e60]:
          - heading "02What I did" [level=2] [ref=f38e61]:
            - generic [ref=f38e62]: "02"
            - text: What I did
          - generic [ref=f38e63]:
            - paragraph [ref=f38e64]: I started with 14 interviews and 6 moderated sessions, then mapped every path from landing to saved report. Three problems showed up in every single one.
            - paragraph [ref=f38e65]: "I proposed a progressive filter model: a single search field that surfaces relevant filters as you type, with the five most common ones pinned. Behind it, the full power set stayed one click away for people who knew what they wanted."
            - paragraph [ref=f38e66]: The chart builder got the opposite treatment. Instead of a blank canvas, it opened with three suggested charts based on the columns in the dataset, each one a starting point you could edit rather than a template you had to configure.
            - paragraph [ref=f38e67]: "Empty states were rewritten as next actions: a sample report to explore, an import button, or a link to the column that was missing — whichever matched why the state was empty."
        - generic [ref=f38e69]:
          - heading "03Shipping it" [level=2] [ref=f38e70]:
            - generic [ref=f38e71]: "03"
            - text: Shipping it
          - generic [ref=f38e72]:
            - paragraph [ref=f38e73]: The riskiest part was that this touched four squads at once. I built the filter model and chart builder first, then extracted them into the design system with tests in Storybook, and migrated each squad behind feature flags.
            - paragraph [ref=f38e74]: "Two things made that work: shipping the visual language as tokens rather than screenshots, so engineers could pull the new values without asking; and writing migration notes per squad instead of one document everyone had to read."
        - generic [ref=f38e76]:
          - heading "04Outcome" [level=2] [ref=f38e77]:
            - generic [ref=f38e78]: "04"
            - text: Outcome
          - generic [ref=f38e79]:
            - paragraph [ref=f38e80]: Median time to first saved report went from just under six minutes to ninety seconds. Weekly report creators grew 34% in the quarter after launch, and dashboard abandonment dropped by half.
            - paragraph [ref=f38e81]: "The empty-state work paid off fastest: users who hit an empty state were three times more likely to come back the next day than before."
        - generic [ref=f38e83]:
          - heading "05What I would do differently" [level=2] [ref=f38e84]:
            - generic [ref=f38e85]: "05"
            - text: What I would do differently
          - paragraph [ref=f38e87]: I would have started the research eight weeks earlier. Most of the delay in the first month was learning the domain, and that knowledge would have sharpened the earlier design work.
        - figure "Priya Raman, VP Product" [ref=f38e88]:
          - blockquote [ref=f38e89]: “The first week Alex was here, our PM stopped defending the redesign roadmap and started defending the research.”
