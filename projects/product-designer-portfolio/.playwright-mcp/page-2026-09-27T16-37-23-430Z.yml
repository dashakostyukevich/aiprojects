      - generic [ref=f38e29]:
        - generic [ref=f38e30]:
          - paragraph [ref=f38e31]: Atlas is a reporting product for teams that do not have an analyst on staff. Before this project, using it well meant learning a query language. The brief was to make reporting feel obvious.
          - paragraph [ref=f38e32]: "I owned the redesign end to end: discovery, interaction model, visual design, and the design system work needed to ship it across four squads without them each inventing their own patterns."
          - paragraph [ref=f38e33]: Time to first insight cut from 6 min to 90 s
