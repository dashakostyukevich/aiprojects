          - heading "The challenge" [level=2] [ref=f150e57]
          - generic [ref=f150e59]:
            - figure "The integration row and the primary CTA, in one crop. NOXS does not ask the team to move — the four tools they already live in are named under the button that asks for the demo, so the pitch and the proof are the same object." [ref=f150e60]:
              - img "The Book a Demo and How it works buttons above the Confluence, Jira, GitLab and GitHub integration logos" [ref=f150e61]
            - paragraph [ref=f150e63]: "Technical teams already work across many tools: Slack for communication, Jira for tasks, Confluence for documentation, Git for development. NOXS was designed to connect these fragmented sources and provide an additional layer of intelligence without forcing teams to adopt another complicated interface."
            - paragraph [ref=f150e64]: "The website needed to answer three questions almost immediately:"
            - paragraph [ref=f150e65]: What is NOXS? How does it fit into my existing workflow? Why should I care?
            - paragraph [ref=f150e66]: The goal was to create a clear, persuasive landing page that could explain the product, build trust, and generate new leads.
        - generic [ref=f150e68]:
          - heading "From a complex product to a simple story" [level=2] [ref=f150e69]
          - generic [ref=f150e71]:
            - paragraph [ref=f150e72]: "I started by understanding the product positioning and its audience: developers, project managers, and digital leads."
            - paragraph [ref=f150e73]: "The core challenge was translating a technical B2B SaaS concept into a visual story that could be understood without requiring visitors to understand the underlying technology first. I structured the experience around a progressive narrative:"
            - paragraph [ref=f150e74]: Problem → Product → How it works → Features → Use cases → Outcomes → Conversion
            - paragraph [ref=f150e75]: Instead of starting with technical details, the page first established the problem — delivery chaos, fragmented data, missed blockers, and inefficient processes — and then positioned NOXS as the solution.
        - generic [ref=f150e77]:
          - heading "Making the value proposition obvious" [level=2] [ref=f150e78]
          - generic [ref=f150e80]:
            - paragraph [ref=f150e81]: "The product offered a lot of functionality:"
            - list [ref=f150e82]:
              - listitem [ref=f150e83]:
                - generic [ref=f150e85]: blocker and technical debt detection
              - listitem [ref=f150e86]:
                - generic [ref=f150e88]: sprint planning and efficiency insights
              - listitem [ref=f150e89]:
                - generic [ref=f150e91]: real-time KPIs
              - listitem [ref=f150e92]:
                - generic [ref=f150e94]: smart search across tools
              - listitem [ref=f150e95]:
                - generic [ref=f150e97]: automated reporting
              - listitem [ref=f150e98]:
                - generic [ref=f150e100]: historical delivery insights
            - paragraph [ref=f150e101]: The challenge was not to show everything at once. It was to create a hierarchy that allowed visitors to understand the value first and explore the functionality second. The design therefore combined concise messaging with visual demonstrations and progressive information disclosure.
            - paragraph [ref=f150e102]: Don’t make users understand the technology before they understand the benefit.
        - generic [ref=f150e104]:
          - heading "Designing for conversion" [level=2] [ref=f150e105]
          - generic [ref=f150e107]:
            - paragraph [ref=f150e108]: Because NOXS is a B2B SaaS product, the website wasn’t just an informational experience. It was also part of the acquisition funnel.
            - paragraph [ref=f150e109]: I designed the information flow to move visitors from problem awareness, through understanding, trust, and interest, to a demo booking. Primary and secondary CTAs were placed throughout the experience so that users could take action once they had enough context.
            - paragraph [ref=f150e110]: The page also used concrete outcomes and use cases to make the product’s value more tangible.
        - generic [ref=f150e112]:
          - heading "Testing the first impression" [level=2] [ref=f150e113]
          - generic [ref=f150e115]:
            - figure "The whole test, in one frame. Everything below the headline is identical; what changed is the framing and the second button. A visitor who already knows the category gets “intelligence layer above your tech infrastructure” from A, and everyone else gets “AI Delivery Assistant” from B — and the second one is the one that shipped." [ref=f150e116]:
              - 'img "The two NOXS hero variants side by side: variant A reading Intelligence layer above your tech infrastructure, variant B reading AI Delivery Assistant" [ref=f150e117]'
            - paragraph [ref=f150e119]: The hero section was particularly important. For a lead-generation landing page, the first screen needs to communicate the product’s value quickly and give visitors a clear next step.
            - paragraph [ref=f150e120]: "Instead of relying only on intuition, I tested two different approaches:"
            - generic [ref=f150e121]:
              - heading "A Conceptual" [level=3] [ref=f150e122]:
                - generic [ref=f150e123]: A
                - generic [ref=f150e124]: Conceptual
              - paragraph [ref=f150e126]: Positioned NOXS as a strategic technology layer and introduced the product more conceptually.
            - generic [ref=f150e127]:
              - heading "B Direct" [level=3] [ref=f150e128]:
                - generic [ref=f150e129]: B
                - generic [ref=f150e130]: Direct
              - paragraph [ref=f150e132]: Explained what NOXS does more explicitly and focused on the immediate benefit.
            - paragraph [ref=f150e133]: Both variants used the same supporting paragraph, but differed in headline framing, CTA hierarchy, and supporting elements.
        - generic [ref=f150e135]:
          - heading "What the data showed" [level=2] [ref=f150e136]
          - generic [ref=f150e138]:
            - paragraph [ref=f150e139]: I used Google Analytics to track conversion behavior and Hotjar to analyze scroll depth and interaction through heatmaps. The direct, benefit-oriented version performed better in overall engagement and conversion.
            - paragraph [ref=f150e140]: "The testing also revealed several useful patterns:"
            - list [ref=f150e141]:
              - listitem [ref=f150e142]:
                - generic [ref=f150e144]: a shorter, action-oriented headline improved clarity for new visitors
              - listitem [ref=f150e145]:
                - generic [ref=f150e147]: users interacted more with the main section in the direct version
              - listitem [ref=f150e148]:
                - generic [ref=f150e150]: adding a secondary CTA increased views
              - listitem [ref=f150e151]:
                - generic [ref=f150e153]: communicating monetary benefits increased interest in booking a demo
            - paragraph [ref=f150e154]: For a complex B2B product, clarity can be more persuasive than sophistication.
