            - paragraph [ref=f150e210]: This allowed the visual design to translate into a practical marketing website rather than remaining a static concept.
        - generic [ref=f150e212]:
          - heading "Outcome" [level=2] [ref=f150e213]
          - generic [ref=f150e215]:
            - paragraph [ref=f150e216]: The project resulted in a B2B SaaS landing page that combined product storytelling, visual design, and conversion experimentation.
            - paragraph [ref=f150e217]: More importantly, the design decisions weren’t based entirely on subjective preference. The A/B test demonstrated that visitors responded better to a more direct explanation of the product and its benefits. This gave the team a clearer direction for future iterations of the website.
        - generic [ref=f150e219]:
          - heading "What I learned" [level=2] [ref=f150e220]
          - generic [ref=f150e222]:
            - generic [ref=f150e223]:
              - heading "Clarity beats complexity" [level=3] [ref=f150e224]
              - paragraph [ref=f150e227]: When the product itself is technically complex, the website doesn’t need to be. The testing showed that first-time visitors responded better when the product’s value was communicated directly rather than conceptually.
            - generic [ref=f150e228]:
              - heading "Design decisions should be testable" [level=3] [ref=f150e229]
              - paragraph [ref=f150e232]: The A/B test turned a subjective question — which hero feels better? — into a measurable product question.
            - generic [ref=f150e233]:
              - heading "Product and marketing need to work together" [level=3] [ref=f150e234]
              - paragraph [ref=f150e237]: For B2B SaaS, the website sits between product understanding and business goals. Working closely with product and marketing helped balance technical accuracy with a clear commercial proposition.
        - figure "What the A/B test showed" [ref=f150e238]:
          - blockquote [ref=f150e239]: For a complex B2B product, clarity can be more persuasive than sophistication.
