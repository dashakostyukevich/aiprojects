          - generic [ref=f150e33]:
            - paragraph [ref=f150e34]: NOXS is an AI-powered virtual assistant for technical teams. It connects with tools such as Slack, Jira, Confluence, and Notion to help teams monitor delivery, detect blockers, automate routine tasks, and turn fragmented project data into actionable information.
            - paragraph [ref=f150e35]: The challenge was to turn a technically complex B2B SaaS product into a website that visitors could understand quickly — and ultimately convince them to book a demo.
